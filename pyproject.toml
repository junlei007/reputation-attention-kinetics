[project]
name = "dengyunetwork"
version = "0.1.0"
description = "Reputation-capital kinetics with attention memory in directed trust networks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengyunetwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (decay analytic-shrink on fine grids)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
